services:
  checkool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkool
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - API_PORT=8787
      - HOST=0.0.0.0
